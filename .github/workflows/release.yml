name: Release

# Runs on every v* tag push. The verify job is the guard behind issue #68: the
# v1.1.0 tag was cut while opus.Version still said "1.0.0", so every exported
# clip carried a stale OpusTags vendor string and nothing noticed.
# TestVersionMatchesReleaseTag fails unless "v"+opus.Version equals the tag, and
# the release job depends on it, so a mismatched tag yields a red workflow and no
# release instead of a wrong one. Recovery: delete the tag, cut it again with
# `task release VERSION=x.y.z` (scripts/release.sh, which bumps and verifies),
# and push.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify opus.Version matches the tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # scripts/verify-version.sh owns the GOOPUS_RELEASE_TAG wiring, the PASS-line
      # check (a SKIP or a renamed test must not pass), and the tee log location
      # ($RUNNER_TEMP, outside the workspace). scripts/release.sh calls the same
      # script before tagging, so the pre-tag and post-tag checks cannot drift.
      - name: Check the version constant against the tag
        # Pass the tag through an env var, not a ${{ }} interpolation inside run:.
        # github.ref_name is expanded into the script before the shell parses it,
        # so a tag name carrying shell metacharacters would inject commands; the
        # env indirection makes the shell see it as data. Matches the "Create
        # draft release" step below.
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/verify-version.sh "$TAG"

  release:
    name: Create draft GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Draft so the notes can be edited before publishing. go-opus is a pure
      # library with no binary artifacts, so there is nothing to attach. A
      # release that already exists (created by hand before the workflow ran) is
      # left alone rather than failing the job.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving it untouched"
            exit 0
          fi
          # A hyphen marks a pre-release tag (semverCore and release.sh accept
          # -rc.1 etc, and the v*.*.* filter matches them). Flag it as such so it
          # is not published as the repo's "Latest release" and does not drive the
          # README version badge.
          args=(--draft --title "$TAG" --generate-notes)
          case "$TAG" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${args[@]}"
